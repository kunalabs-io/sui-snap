name: Deploy to production

# Fast-forwards the `production` branch to `master`. Cloudflare Pages builds
# the wallet-dapp from `production`, so this is the deploy button.
#
# The `production` environment has required reviewers, so a run sits as a
# pending deployment until approved. The push uses a write deploy key stored
# as an environment secret (only readable by an approved run); the
# `production` branch ruleset only lets deploy keys push, so this workflow
# is the only way the branch moves. GITHUB_TOKEN can't be used: GitHub
# Actions isn't accepted as a ruleset bypass actor.

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Fast-forward production to master
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          # Switches the remote to SSH and authenticates as the deploy key,
          # so the push below bypasses the production ruleset.
          ssh-key: ${{ secrets.PRODUCTION_DEPLOY_KEY }}

      - name: Verify fast-forward
        run: |
          git fetch origin production
          if ! git merge-base --is-ancestor origin/production master; then
            echo "::error::production is not an ancestor of master; refusing non-fast-forward deploy"
            exit 1
          fi
          echo "Deploying:"
          git log --oneline origin/production..master

      - name: Push
        run: git push origin master:production
